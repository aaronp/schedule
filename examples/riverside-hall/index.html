<!doctype html>
<meta charset="utf-8">
<title>Riverside Hall schedule</title>
<script>
  // The scheduler lives in its own repo; this repo only holds the data.
  // Extra query params are passed through, e.g. ?theme=paper.
  const VIEWER = 'https://aaronp.github.io/schedule/';
  const src = new URL('schedule.md', location.href).href;
  location.replace(VIEWER + '?src=' + encodeURIComponent(src) + location.search.replace(/^\?/, '&') + location.hash);
</script>
<a href="schedule.md">schedule.md</a>
